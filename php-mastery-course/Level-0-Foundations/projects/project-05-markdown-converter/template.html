<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Georgia', 'Times New Roman', serif;
    max-width: 720px;
    margin: 0 auto;
    padding: 3rem 1.5rem;
    line-height: 1.8;
    color: #1a1a2e;
    background: #fafafa;
  }
  h1 { font-size: 2.2rem; margin: 2rem 0 1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }
  h2 { font-size: 1.6rem; margin: 1.8rem 0 0.8rem; color: #2d3748; }
  h3 { font-size: 1.3rem; margin: 1.5rem 0 0.6rem; }
  h4 { font-size: 1.1rem; margin: 1.2rem 0 0.5rem; }
  p { margin-bottom: 1rem; }
  a { color: #4f46e5; text-decoration: underline; }
  a:hover { color: #3730a3; }
  ul, ol { margin: 0.5rem 0 1rem 2rem; }
  li { margin-bottom: 0.3rem; }
  code {
    background: #e2e8f0;
    padding: 0.15rem 0.45rem;
    border-radius: 4px;
    font-size: 0.88em;
    font-family: 'Fira Code', 'Cascadia Code', Menlo, monospace;
    color: #c026d3;
  }
  pre {
    background: #1e293b;
    color: #e2e8f0;
    padding: 1.25rem;
    border-radius: 8px;
    overflow-x: auto;
    margin: 1rem 0;
  }
  pre code {
    background: none;
    padding: 0;
    color: inherit;
    font-size: 0.85rem;
  }
  blockquote {
    border-left: 4px solid #4f46e5;
    margin: 1rem 0;
    padding: 0.75rem 1.5rem;
    background: #f1f5f9;
    border-radius: 0 8px 8px 0;
    color: #374151;
  }
  blockquote p:last-child { margin-bottom: 0; }
  hr {
    border: 0;
    border-top: 2px solid #e2e8f0;
    margin: 2rem 0;
  }
  img {
    max-width: 100%;
    border-radius: 8px;
    margin: 1rem 0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
  }
  th, td {
    border: 1px solid #e2e8f0;
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  th { background: #f1f5f9; font-weight: 600; }
  .footnote { color: #64748b; font-size: 0.85rem; }
</style>
</head>
<body>
{{BODY}}
</body>
</html>
