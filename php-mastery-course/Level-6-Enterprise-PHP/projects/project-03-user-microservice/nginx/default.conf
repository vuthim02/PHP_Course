server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # API routes
    location /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg)$ {
        expires max;
        log_not_found off;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_param APP_ENV development;
        fastcgi_param DB_HOST mysql;
        fastcgi_param DB_PORT 3306;
        fastcgi_param DB_DATABASE user_service;
        fastcgi_param DB_USERNAME user_service;
        fastcgi_param DB_PASSWORD secret_password;
        fastcgi_param REDIS_HOST redis;
        fastcgi_param REDIS_PORT 6379;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
    }

    # Deny sensitive directories
    location ~ ^/(config|migrations|src|tests|vendor)/ {
        deny all;
        return 404;
    }
}
